<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#f5f5f5;
    }

    .signup-container{
      width:350px;
      background:white;
      padding:30px;
      border-radius:10px;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
    }

    .signup-container h2{
      text-align:center;
      margin-bottom:20px;
      color:#333;
    }

    .input-group{
      margin-bottom:15px;
    }

    .input-group input{
      width:100%;
      padding:12px;
      border:1px solid #ccc;
      border-radius:6px;
      font-size:16px;
    }

    .signup-btn{
      width:100%;
      padding:12px;
      background:#28a745;
      border:none;
      border-radius:6px;
      color:white;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
    }

    .signup-btn:hover{
      background:#1e7e34;
    }

    #message{
      margin-top:15px;
      text-align:center;
      color:red;
      font-size:14px;
    }

    .login-link{
      margin-top:15px;
      text-align:center;
      font-size:14px;
    }

    .login-link a{
      color:#007bff;
      text-decoration:none;
    }

  </style>
</head>

<body>

  <div class="signup-container">

    <h2>Create Account</h2>

    <div class="input-group">
  <input type="text"
         id="name"
         placeholder="Enter Full Name">
</div>

<div class="input-group">
  <input type="email"
         id="email"
         placeholder="Enter Email">
</div>

<div class="input-group">
  <input type="password"
         id="password"
         placeholder="Enter Password">
</div>


    <button class="signup-btn" id="signupBtn">
      Signup
    </button>

    <p id="message"></p>

    <div class="login-link">
      Already have an account?
      <a href="login.html">Login</a>
    </div>

  </div>

  <script type="module" src="./scripts/signup.min.js"></script>

</body>

</html>
