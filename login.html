<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>

  <link rel="preconnect"
      href="https://www.gstatic.com">

<link rel="preconnect"
      href="https://fonts.googleapis.com">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#f5f5f5;
    }

    .login-container{
      width:350px;
      background:white;
      padding:30px;
      border-radius:10px;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
    }

    .login-container h2{
      text-align:center;
      margin-bottom:20px;
      color:#333;
    }

    .input-group{
      margin-bottom:15px;
    }

    .input-group input{
      width:100%;
      padding:12px;
      border:1px solid #ccc;
      border-radius:6px;
      font-size:16px;
    }

    .login-btn{
      width:100%;
      padding:12px;
      background:#007bff;
      border:none;
      border-radius:6px;
      color:white;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
    }

    .login-btn:hover{
      background:#0056b3;
    }

    #message{
      margin-top:15px;
      text-align:center;
      color:red;
      font-size:14px;
    }

    .signup-link{
      margin-top:15px;
      text-align:center;
      font-size:14px;
    }

    .signup-link a{
      color:#007bff;
      text-decoration:none;
    }

  </style>
</head>

<body>

  <div class="login-container">

    <h2>Login</h2>

    <div class="input-group">
      <input type="email" id="email" placeholder="Enter Email">
    </div>

    <div class="input-group">
      <input type="password" id="password" placeholder="Enter Password">
    </div>

    <button class="login-btn" id="loginBtn">
      Login
    </button>

    <p id="message"></p>

    <div class="signup-link">
      Don't have an account?
      <a href="signup.html">Signup</a>
    </div>

  </div>

  <script type="module" src="./scripts/login.js"></script>
</body>

</html>
